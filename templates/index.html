<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat z Vertex AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 800px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 90vh;
        }

        .chat-header {
            background: linear-gradient(135deg, #4285f4 0%, #34a853 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .chat-header h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }

        .chat-header p {
            opacity: 0.9;
            font-size: 0.9rem;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 80%;
            padding: 12px 18px;
            border-radius: 18px;
            line-height: 1.5;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            background: #4285f4;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 5px;
        }

        .message.assistant {
            background: #f1f3f4;
            color: #202124;
            align-self: flex-start;
            border-bottom-left-radius: 5px;
        }

        .message.error {
            background: #fce8e6;
            color: #c5221f;
            align-self: center;
        }

        .typing-indicator {
            display: none;
            align-self: flex-start;
            padding: 12px 18px;
            background: #f1f3f4;
            border-radius: 18px;
        }

        .typing-indicator.visible {
            display: flex;
            gap: 5px;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: #5f6368;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }

        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        .chat-input-container {
            padding: 20px;
            background: #f8f9fa;
            border-top: 1px solid #e0e0e0;
        }

        .chat-input-form {
            display: flex;
            gap: 10px;
        }

        .chat-input {
            flex: 1;
            padding: 15px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .chat-input:focus {
            border-color: #4285f4;
        }

        .send-button {
            padding: 15px 25px;
            background: #4285f4;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
        }

        .send-button:hover {
            background: #3367d6;
        }

        .send-button:active {
            transform: scale(0.95);
        }

        .send-button:disabled {
            background: #9aa0a6;
            cursor: not-allowed;
        }

        .reset-button {
            padding: 10px 15px;
            background: transparent;
            color: #5f6368;
            border: 1px solid #dadce0;
            border-radius: 20px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.3s;
        }

        .reset-button:hover {
            background: #f1f3f4;
        }

        .chat-footer {
            display: flex;
            justify-content: center;
            padding: 10px;
            background: #f8f9fa;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>Chat z Vertex AI</h1>
            <p>Powered by Google Gemini</p>
        </div>

        <div class="chat-messages" id="messages">
            <div class="message assistant">
                Cześć! Jestem asystentem AI. W czym mogę Ci pomóc?
            </div>
            <div class="typing-indicator" id="typing">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>

        <div class="chat-input-container">
            <form class="chat-input-form" id="chatForm">
                <input
                    type="text"
                    class="chat-input"
                    id="messageInput"
                    placeholder="Napisz wiadomość..."
                    autocomplete="off"
                    required
                >
                <button type="submit" class="send-button" id="sendButton">
                    Wyślij
                </button>
            </form>
        </div>

        <div class="chat-footer">
            <button class="reset-button" id="resetButton">
                Nowa rozmowa
            </button>
        </div>
    </div>

    <script>
        const messagesContainer = document.getElementById('messages');
        const chatForm = document.getElementById('chatForm');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        const resetButton = document.getElementById('resetButton');
        const typingIndicator = document.getElementById('typing');

        // Generuj unikalny session ID
        const sessionId = 'session_' + Math.random().toString(36).substr(2, 9);

        function addMessage(text, type) {
            const message = document.createElement('div');
            message.className = `message ${type}`;
            message.textContent = text;
            messagesContainer.insertBefore(message, typingIndicator);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function setLoading(loading) {
            sendButton.disabled = loading;
            messageInput.disabled = loading;
            typingIndicator.classList.toggle('visible', loading);
            if (loading) {
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }
        }

        async function sendMessage(message) {
            setLoading(true);

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: message,
                        session_id: sessionId
                    })
                });

                const data = await response.json();

                if (data.error) {
                    addMessage('Błąd: ' + data.error, 'error');
                } else {
                    addMessage(data.response, 'assistant');
                }
            } catch (error) {
                addMessage('Błąd połączenia: ' + error.message, 'error');
            } finally {
                setLoading(false);
                messageInput.focus();
            }
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const message = messageInput.value.trim();
            if (!message) return;

            addMessage(message, 'user');
            messageInput.value = '';

            await sendMessage(message);
        });

        resetButton.addEventListener('click', async () => {
            try {
                await fetch('/reset', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ session_id: sessionId })
                });

                // Wyczyść wiadomości
                const messages = messagesContainer.querySelectorAll('.message');
                messages.forEach(msg => msg.remove());

                addMessage('Cześć! Jestem asystentem AI. W czym mogę Ci pomóc?', 'assistant');
            } catch (error) {
                console.error('Reset error:', error);
            }
        });

        // Focus na input przy starcie
        messageInput.focus();
    </script>
</body>
</html>
